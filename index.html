<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Umur dalam Minggu</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.subtitle {
    font-size: 14px;
    color: #666;
    margin: 0 0 24px;
  }
  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label {
    font-size: 13px;
    color: #555;
  }
  input {
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    min-width: 160px;
  }
  button {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 500;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #333; }
  #error {
    color: #c0392b;
    font-size: 13px;
    display: none;
    margin: 0 0 12px;
  }
  .summary {
    display: none;
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    flex: 1;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 12px 16px;
  }
  .summary-card .label {
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
  }
  .summary-card .value {
    font-size: 22px;
    font-weight: 600;
  }
  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
    color: #555;
    margin-bottom: 12px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .chart-wrap {
    overflow-x: auto;
    padding-bottom: 12px;
  }
  .chart-inner {
    display: flex;
  }
  .year-labels {
    display: flex;
    flex-direction: column;
    padding-top: 14px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .year-label, .year-spacer {
    height: 8px;
    font-size: 9px;
    color: #999;
    line-height: 8px;
    text-align: right;
    padding-right: 4px;
    white-space: nowrap;
  }
  .week-labels {
    display: flex;
    font-size: 9px;
    color: #999;
    margin-bottom: 2px;
  }
  .week-label {
    flex-shrink: 0;
  }
  .row {
    display: flex;
    gap: 2px;
    margin-bottom: 2px;
  }
  .box {
    width: 6px;
    height: 6px;
    border-radius: 1px;
    flex-shrink: 0;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Kalender umur dalam minggu</h1>
  <p class="subtitle">1 kotak = 1 minggu. Masukkan data di bawah untuk melihat gambaran umurmu.</p>

  <div class="form-row">
    <div class="field">
      <label for="expectancy">Usia harapan hidup (tahun)</label>
      <input type="number" id="expectancy" value="75" min="1" max="100">
    </div>
    <div class="field">
      <label for="birthdate">Tanggal lahir</label>
      <input type="date" id="birthdate">
    </div>
    <button id="submitBtn">Tampilkan</button>
  </div>
  <p id="error"></p>

  <div class="legend">
    <span><span class="swatch" style="background:#b3b3ac;"></span>Sudah dilewati</span>
    <span><span class="swatch" style="background:#639922;"></span>Tersisa</span>
  </div>

  <div class="summary" id="summary">
    <div class="summary-card">
      <div class="label">Minggu terlewati</div>
      <div class="value" id="weeksPassed">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Minggu tersisa</div>
      <div class="value" id="weeksLeft">0</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-inner">
      <div class="year-labels" id="yearLabels"></div>
      <div>
        <div class="week-labels" id="weekLabels"></div>
        <div id="grid"></div>
      </div>
    </div>
  </div>

  <footer>Life in weeks</footer>
</div>

<script>
const BOX = 6;
const GAP = 2;

const btn = document.getElementById('submitBtn');
const errEl = document.getElementById('error');
const gridEl = document.getElementById('grid');
const yearLabelsEl = document.getElementById('yearLabels');
const weekLabelsEl = document.getElementById('weekLabels');
const summaryEl = document.getElementById('summary');

function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
}
function clearError() {
  errEl.style.display = 'none';
}

function render() {
  clearError();
  const expectancy = parseInt(document.getElementById('expectancy').value, 10);
  const birthVal = document.getElementById('birthdate').value;

  if (!expectancy || expectancy <= 0) {
    showError('Masukkan usia harapan hidup yang valid.');
    return;
  }

  gridEl.innerHTML = '';
  yearLabelsEl.innerHTML = '';
  weekLabelsEl.innerHTML = '';
  summaryEl.style.display = 'none';

  const totalWeeks = Math.round(expectancy * 52);
  let weeksPassed = 0;
  let hasBirth = false;

  if (birthVal) {
    const birth = new Date(birthVal + 'T00:00:00');
    if (isNaN(birth.getTime())) {
      showError('Format tanggal lahir tidak valid.');
      return;
    }
    const today = new Date();
    const diffMs = today - birth;
    if (diffMs < 0) {
      showError('Tanggal lahir tidak boleh di masa depan.');
      return;
    }
    hasBirth = true;
    weeksPassed = Math.min(totalWeeks, Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7)));
    summaryEl.style.display = 'flex';
    document.getElementById('weeksPassed').textContent = weeksPassed.toLocaleString('id-ID');
    document.getElementById('weeksLeft').textContent = (totalWeeks - weeksPassed).toLocaleString('id-ID');
  }

  for (let w = 1; w <= 52; w += 4) {
    const lbl = document.createElement('div');
    lbl.className = 'week-label';
    lbl.style.width = (BOX + GAP) * 4 + 'px';
    lbl.textContent = w;
    weekLabelsEl.appendChild(lbl);
  }

  for (let y = 0; y < expectancy; y++) {
    if (y % 5 === 0) {
      const yl = document.createElement('div');
      yl.className = 'year-label';
      yl.textContent = y;
      yearLabelsEl.appendChild(yl);
    } else {
      const spacer = document.createElement('div');
      spacer.className = 'year-spacer';
      yearLabelsEl.appendChild(spacer);
    }

    const row = document.createElement('div');
    row.className = 'row';

    for (let w = 0; w < 52; w++) {
      const idx = y * 52 + w;
      const box = document.createElement('div');
      box.className = 'box';
      if (hasBirth) {
        box.style.background = idx < weeksPassed ? '#b3b3ac' : '#639922';
      } else {
        box.style.background = '#639922';
      }
      row.appendChild(box);
    }
    gridEl.appendChild(row);
  }
}

btn.addEventListener('click', render);
render();
</script>
</body>
</html>
